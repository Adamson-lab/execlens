[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execlens"
version = "0.1.0"
description = "Executive decision intelligence: cloud landing-zone compliance, risk in money, payment leakage, vendor concentration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
execlens = "execlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
execlens = ["web/*.html"]
