name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.10", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: execlens demo --out out --sims 3000
  landing-zone-gate:
    # Example: use the scorecard as a pipeline gate. Fails the build if the estate scores below 70.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install .
      - run: execlens lz --inventory examples/landing_zone_inventory.json --fail-under 70
