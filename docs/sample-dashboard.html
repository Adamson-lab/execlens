.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff}.critical{background:var(--r)}.high{background:#ea580c}.medium{background:var(--a)}.low{background:var(--b2)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-size:11px;color:var(--mut)}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
ol.act{margin:0;padding-left:20px}ol.act li{margin:6px 0}.mut{color:var(--mut)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

 return `<text x="0" y="${i*h+16}" font-size="12" fill="var(--ink)">${esc(r.l.slice(0,28))}</text><rect x="${lw}" y="${i*h+4}" width="${bw}" height="14" rx="3" fill="${r.c||'var(--b)'}"><title>${esc(r.l)}: ${esc(fmt(r.v))}</title></rect><text x="${lw+bw+6}" y="${i*h+16}" font-size="12" fill="var(--mut)">${esc(fmt(r.v))}</text>`}).join('')+'</svg>'}

function spark(vals){if(vals.length<2)return '<span class="mut">collecting history…</span>';const w=220,h=44,mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;

 return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="var(--b)" stroke-width="2"/></svg>`}

function tree(accts){const ous=[...new Set(accts.map(a=>a.ou))],cell=26,per=4;
 const cols=ous.map(o=>{const n=accts.filter(a=>a.ou===o).length;return{o,n,w:Math.max(150,Math.min(per,n)*cell+30)}});
 const W=cols.reduce((s,c)=>s+c.w,0)+10,rootX=W/2;let x=5,maxRows=1;
 let svg='';const ouScore=o=>{const l=accts.filter(a=>a.ou===o);return l.reduce((s,a)=>s+a.score,0)/l.length};
 const overall=accts.reduce((s,a)=>s+a.score,0)/accts.length;
 cols.forEach(c=>{const cx=x+c.w/2;c.cx=cx;x+=c.w;const sc=ouScore(c.o),rows=Math.ceil(c.n/per);maxRows=Math.max(maxRows,rows);

  svg+=`<rect x="${cx-68}" y="86" width="136" height="26" rx="8" fill="${col(sc)}"><title>${esc(c.o)}: ${sc.toFixed(1)}</title></rect><text x="${cx}" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">${esc(c.o)} ${sc.toFixed(0)}</text>`;

function heat(accts){const cw=82,ch=24,lw=200,hh=36,doms=D.landing_zone.domains.map(d=>d.name),W=lw+(doms.length+1)*cw;

 return `<div class="scroll"><svg viewBox="0 0 ${W} ${hh+accts.length*ch+4}" style="min-width:640px" class="chart">${s}</svg></div>`}

function vLZ(){const L=D.landing_zone,ac=filt(),n=ac.length||1,ov=ac.reduce((s,a)=>s+a.score,0)/n;

 const ous=['All',...new Set(L.accounts.map(a=>a.ou))];
 return `<div class="row"><b>Scope</b><select id="ou">${ous.map(o=>`<option ${o===ouF?'selected':''}>${esc(o)}</option>`).join('')}</select><span class="mut">${ac.length} accounts · red &lt;75 · amber 75–89 · green ≥90</span></div>
 <div class="grid g2"><div class="card"><h3>Compliance score</h3>${gauge(ov)}<div style="text-align:center">${spark(hist)}<div class="mut" style="font-size:11px">score history this session</div></div></div>
 <div class="card"><h3>By control domain</h3>${hbars(doms.map(d=>({l:d.name,v:d.score,c:col(d.score)})),100,v=>v.toFixed(1),110)}<h3 style="margin-top:14px">By framework</h3>${hbars(fwScores(ac).map(d=>({l:d.name,v:d.score,c:col(d.score)})),100,v=>v.toFixed(1),110)}</div></div>
 <div class="card" style="margin-top:14px"><h3>Landing zone diagram: org root → OUs → accounts (colour = RAG)</h3>${tree(ac)}</div>
 <div class="card" style="margin-top:14px"><h3>Account × domain heatmap (worst first)</h3>${heat(ac)}</div>
 <div class="card scroll" style="margin-top:14px"><h3>Top failing controls (impact = weight × accounts failing)</h3><table><tr><th>Control</th><th>Sev</th><th>Failing</th><th>Frameworks</th><th>Fix</th></tr>${cs.map(c=>`<tr><td><b>${esc(c.id)}</b> ${esc(c.title)}</td><td>${pill(c.severity)}</td><td>${c.fail}/${c.N}</td><td>${c.frameworks.map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</td><td class="mut">${esc(c.remediation)}</td></tr>`).join('')||'<tr><td colspan="5">All controls passing</td></tr>'}</table></div>`}

function lec(c,app){const W=640,H=280,m={l:48,r:14,t:12,b:34},lg=v=>Math.log10(v),x0=lg(c.x[0]),x1=lg(c.x[c.x.length-1]);
 const X=v=>m.l+(lg(v)-x0)/(x1-x0)*(W-m.l-m.r),Y=p=>m.t+(1-p)*(H-m.t-m.b);let s='';
 [0,.25,.5,.75,1].forEach(p=>s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(p)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(p*100)}%</text>`);
 for(let i=0;i<5;i++){const v=Math.pow(10,x0+(x1-x0)*i/4);s+=`<text x="${X(v)}" y="${H-12}" text-anchor="${i===4?'end':'middle'}" font-size="11" fill="var(--mut)">${money(v)}</text>`}
 const line=(arr,color)=>`<polyline fill="none" stroke="${color}" stroke-width="2.5" points="${c.x.map((x,i)=>X(x).toFixed(1)+','+Y(arr[i]).toFixed(1)).join(' ')}"/>`;
 s+=line(c.base,'var(--r)')+line(c.ctrl,'var(--g)');
 if(app&&app>c.x[0]&&app<c.x[c.x.length-1])s+=`<line x1="${X(app)}" x2="${X(app)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${X(app)+5}" y="${m.t+12}" font-size="11" fill="var(--ink)">appetite ${money(app)}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg><div class="legend"><span><i class="sw" style="background:var(--r)"></i>today</span><span><i class="sw" style="background:var(--g)"></i>with proposed controls</span><span class="mut">y = chance annual loss exceeds x</span></div>`}

function vRisk(){const R=D.risk,t=R.total,tc=R.total_ctrl;
 const rows=[];R.scenarios.forEach(s=>{rows.push({l:s.name,v:s.mean,c:'var(--r)'});if(s.control)rows.push({l:'   ↳ with control',v:s.control.residual_mean,c:'var(--g)'})});
 return `<div class="grid g4"><div class="card kpi"><h3>Expected annual loss</h3><div class="v">${money(t.mean)}</div><div class="s">→ ${money(tc.mean)} with controls</div></div>
 <div class="card kpi"><h3>1-in-20 bad year (p95)</h3><div class="v">${money(t.p95)}</div><div class="s">→ ${money(tc.p95)} with controls</div></div>
 <div class="card kpi"><h3>1-in-100 (p99)</h3><div class="v">${money(t.p99)}</div><div class="s">→ ${money(tc.p99)} with controls</div></div>
 <div class="card kpi"><h3>Chance of exceeding appetite</h3><div class="v">${pct(R.p_exceed_base)}</div><div class="s">→ ${pct(R.p_exceed_ctrl)} · appetite ${money(R.appetite)}</div></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Loss exceedance curve</h3>${lec(R.curve,R.appetite)}</div>
 <div class="card"><h3>Expected annual loss by scenario</h3>${hbars(rows,Math.max(...rows.map(r=>r.v)),money,200)}</div></div>
 <div class="card scroll" style="margin-top:14px"><h3>Control business case (control spend ${money(R.control_spend)}/yr)</h3><table><tr><th>Scenario</th><th>Control</th><th>Cost/yr</th><th>Loss avoided/yr</th><th>Net ROI</th><th>Bad-year (p95)</th></tr>${R.scenarios.filter(s=>s.control).sort((a,b)=>b.control.roi-a.control.roi).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.control.name)}</td><td>${money(s.control.cost)}</td><td>${money(s.control.benefit)}</td><td><b style="color:${s.control.roi>0?'var(--g)':'var(--r)'}">${(s.control.roi*100).toFixed(0)}%</b></td><td>${money(s.control.p95_before)} → ${money(s.control.p95_after)}</td></tr>`).join('')}</table><p class="mut" style="font-size:12px">A control can have negative expected ROI and still be worth funding if it cuts the tail; compare both columns.</p></div>`}

function vLeak(){const F=D.forensics,kinds=Object.entries(F.by_kind).sort((a,b)=>b[1]-a[1]),tot=kinds.reduce((s,k)=>s+k[1],0);
 const list=F.findings.filter(f=>sevF==='All'||f.severity===sevF);
 return `<div class="grid g4"><div class="card kpi"><h3>Flagged exposure</h3><div class="v">${money(tot)}</div><div class="s">across ${F.payments.toLocaleString()} payments</div></div><div class="card kpi"><h3>Findings</h3><div class="v">${F.count}</div><div class="s">${F.findings.filter(f=>f.severity==='critical').length} critical</div></div></div>
 <div class="card" style="margin-top:14px"><h3>Exposure by pattern</h3>${hbars(kinds.map(([k,v])=>({l:k.replace('_',' '),v,c:k==='ghost_vendor'?'var(--r)':'var(--b)'})),Math.max(...kinds.map(k=>k[1])),money,150)}</div>
 <div class="card" style="margin-top:14px"><div class="row"><h3 style="margin:0">Findings</h3><select id="sev">${['All','critical','high','medium'].map(s=>`<option ${s===sevF?'selected':''}>${s}</option>`).join('')}</select></div><div class="scroll"><table><tr><th>Sev</th><th>Pattern</th><th>Exposure</th><th>What we found</th></tr>${list.map(f=>`<tr><td>${pill(f.severity)}</td><td>${esc(f.kind.replace('_',' '))}</td><td>${f.exposure?money(f.exposure):'–'}</td><td><details><summary>${esc(f.summary)}</summary><pre>${esc(f.evidence.join('\n'))}</pre></details></td></tr>`).join('')}</table></div><p class="mut" style="font-size:12px">Indicators for investigation, not proof of wrongdoing.</p></div>`}

function vVend(){const C=D.concentration;
 return `<div class="grid g4"><div class="card kpi"><h3>Top vendor share</h3><div class="v">${C.top1.toFixed(0)}%</div><div class="s">of ${money(C.total)} spend</div></div><div class="card kpi"><h3>Top 5 share</h3><div class="v">${C.top5.toFixed(0)}%</div><div class="s">${C.vendors} vendors paid</div></div><div class="card kpi"><h3>Spend HHI</h3><div class="v">${Math.round(C.hhi)}</div><div class="s">${C.hhi>2500?'highly concentrated':C.hhi>1500?'moderately concentrated':'diversified'}</div></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Top vendors by share of spend</h3>${hbars(C.top_vendors.map(v=>({l:v.name+(v.sole_source&&v.critical?' ⚠':''),v:v.share,c:v.sole_source&&v.critical?'var(--r)':'var(--b)'})),Math.max(...C.top_vendors.map(v=>v.share)),v=>v.toFixed(1)+'%',200)}<div class="mut" style="font-size:12px">⚠ critical and sole-source</div></div>
 <div class="card"><h3>Concentration by category (HHI)</h3>${hbars(C.categories.map(c=>({l:c.name,v:c.hhi,c:c.hhi>2500?'var(--r)':c.hhi>1500?'var(--a)':'var(--g)'})),10000,v=>Math.round(v),120)}</div></div>
 <div class="card scroll" style="margin-top:14px"><h3>Single points of failure</h3><table><tr><th>Sev</th><th>Finding</th></tr>${C.spof.map(f=>`<tr><td>${pill(f.severity)}</td><td>${esc(f.summary)}</td></tr>`).join('')||'<tr><td colspan="2">None</td></tr>'}</table></div>`}

function vOver(){const L=D.landing_zone,R=D.risk,F=D.forensics,C=D.concentration;
 const tot=Object.values(F.by_kind).reduce((s,v)=>s+v,0);
 const worst=ctrlStats(L.accounts).filter(c=>c.fail).sort((a,b)=>b.fail*b.weight-a.fail*a.weight)[0];
 const best=R.scenarios.filter(s=>s.control).sort((a,b)=>b.control.roi-a.control.roi)[0];
 const gh=F.findings.find(f=>f.severity==='critical'),sp=C.spof[0],red=L.accounts.filter(a=>a.rag==='red').length;
 return `<div class="grid g4"><div class="card kpi"><h3>Cloud landing zone</h3>${gauge(L.overall)}<div class="s" style="text-align:center">${red} of ${L.accounts.length} accounts red</div></div>
 <div class="card kpi"><h3>Expected annual loss</h3><div class="v">${money(R.total.mean)}</div><div class="s">→ ${money(R.total_ctrl.mean)} with controls · bad year ${money(R.total.p95)}</div></div>
 <div class="card kpi"><h3>Payment leakage flagged</h3><div class="v">${money(tot)}</div><div class="s">${F.count} findings to investigate</div></div>
 <div class="card kpi"><h3>Supplier dependence</h3><div class="v">${C.top1.toFixed(0)}%</div><div class="s">of spend with one vendor</div></div></div>
 <div class="card" style="margin-top:14px"><h2>Five decisions for Monday</h2><ol class="act">
 ${worst?`<li><b>Close ${esc(worst.id)}:</b> ${esc(worst.title)} fails in ${worst.fail} of ${worst.N} accounts. ${esc(worst.remediation)}.</li>`:''}
 ${best?`<li><b>${best.control.roi>0?'Fund':'Review'} "${esc(best.control.name)}":</b> avoids ${money(best.control.benefit)}/yr for ${money(best.control.cost)}/yr (net ROI ${(best.control.roi*100).toFixed(0)}%); bad-year loss ${money(best.control.p95_before)} → ${money(best.control.p95_after)}.</li>`:''}
 ${gh?`<li><b>Freeze and investigate:</b> ${esc(gh.summary)}.</li>`:''}
 ${sp?`<li><b>De-risk supply:</b> ${esc(sp.summary)}.</li>`:''}
 <li><b>Board risk position:</b> ${pct(R.p_exceed_base)} chance of losing more than ${money(R.appetite)} in a year today, ${pct(R.p_exceed_ctrl)} after the proposed controls.</li></ol></div>
 <div class="card" style="margin-top:14px"><h3>Landing zone at a glance</h3>${tree(L.accounts)}</div>`}

const VIEWS={overview:vOver,lz:vLZ,risk:vRisk,leak:vLeak,vendors:vVend};
function render(){if(!D)return;$('#ttl').textContent=D.meta.title;
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
 $('#view').innerHTML=VIEWS[tab]();
 const o=$('#ou');if(o)o.onchange=e=>{ouF=e.target.value;render()};const s=$('#sev');if(s)s.onchange=e=>{sevF=e.target.value;render()};
 const lv=$('#live');lv.className='live'+(EMBED?' snap':'');lv.innerHTML=`<span class="dot"></span>${EMBED?'SNAPSHOT '+esc(D.meta.generated):'LIVE · updated '+new Date().toLocaleTimeString()}`}
$('#nav').addEventListener('click',e=>{const t=e.target.dataset&&e.target.dataset.t;if(t){tab=t;render()}});
async function load(){try{D=EMBED||await (await fetch('/api/data')).json();hist.push(D.landing_zone.overall);if(hist.length>60)hist.shift();render()}catch(e){$('#view').innerHTML='<p class="mut">Waiting for data…</p>'}}
load();if(!EMBED)setInterval(load,4000);
</script></body></html>
